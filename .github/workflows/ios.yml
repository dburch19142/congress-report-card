# Tests the iPhone app in congress-app/ and builds it on a Mac.
#
# test        every change to the app: the Flutter tests, on Linux.
# build       every change to the app: an unsigned release build for iPhone, which proves the
#             app compiles with Xcode. The unsigned Runner.app is kept as an artifact for a week.
# testflight  only when started by hand from the Actions tab with "Upload to TestFlight" ticked.
#             Signs the app and uploads it to App Store Connect.
#
# Signing is Xcode's automatic signing driven by an App Store Connect API key with the Admin
# role, so no certificates or profiles are stored here. It works the same way as the GHSA
# football app's TestFlight workflow. Repository secrets:
#   APPLE_TEAM_ID                   10-character team ID (developer.apple.com > Membership)
#   APP_STORE_CONNECT_KEY_ID        the API key's Key ID
#   APP_STORE_CONNECT_ISSUER_ID     the Issuer ID shown above the key list
#   APP_STORE_CONNECT_API_KEY_P8    the full contents of AuthKey_<KeyID>.p8
name: iOS app

on:
  push:
    branches: [main, congress-mobile-app]
    paths: ["congress-app/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["congress-app/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: congress-app

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  build:
    needs: test
    if: ${{ !inputs.testflight }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # App Store Connect only accepts builds from a recent Xcode, so use the newest one installed.
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build for iPhone without signing
        run: flutter build ios --release --no-codesign --build-number ${{ github.run_number }}
      - name: Zip the app
        run: ditto -c -k --keepParent build/ios/iphoneos/Runner.app Runner-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ github.run_number }}
          path: congress-app/Runner-unsigned.zip
          retention-days: 7

  testflight:
    needs: test
    if: ${{ inputs.testflight }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      # TestFlight needs a build number above every earlier upload.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check the Apple secrets are set
        working-directory: .
        run: |
          missing=""
          for name in TEAM_ID KEY_ID ISSUER_ID API_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. See 'Send a build to TestFlight' in congress-app/README.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Write API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Prepare Xcode project
        run: flutter build ios --config-only --release --no-codesign --build-number="$BUILD_NUMBER"

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export and upload to TestFlight
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER to App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        working-directory: .
        run: rm -rf "$RUNNER_TEMP/keys"
