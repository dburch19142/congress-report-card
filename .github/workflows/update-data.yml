# Rebuilds the report-card data every night and republishes the site.
# Needs the repository secret CONGRESS_API_KEY (Settings → Secrets and variables → Actions).
name: Nightly data update

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 5 a.m. Eastern (4 a.m. in winter)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python -u build_data.py
      - name: Commit updated data
        id: commit
        run: |
          if git diff --quiet -- site/data/members.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/members.js
          git commit -m "Nightly data update $(date -u +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made by this workflow don't trigger other workflows, so deploy here.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
